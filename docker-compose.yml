services:
  db:
    image: postgres:16-alpine
    container_name: decoration-quant-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-quant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quant_dev_pw}
      - POSTGRES_DB=${POSTGRES_DB:-decoration_quant}
    ports:
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant} -d decoration_quant"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: decoration-quant
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - FLASK_DEBUG=0
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@decoration-quant.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quant}:${POSTGRES_PASSWORD:-quant_dev_pw}@db:5432/decoration_quant
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./app/static/reports:/app/app/static/reports
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
