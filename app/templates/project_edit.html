{% extends "base.html" %}
{% block title %}编辑项目 - {{ project.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>编辑项目配置</h2>
    <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-outline btn-sm">返回</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="project-form">
            <div class="form-group">
                <label for="name">项目名称 <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="form-control" value="{{ project.name }}" required>
            </div>
            <div class="form-group">
                <label for="description">项目描述</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ project.description or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="address">项目地址</label>
                <input type="text" id="address" name="address" class="form-control" value="{{ project.address or '' }}">
            </div>

            <h4 class="form-section-title">算量配置</h4>

            <div class="form-row">
                <div class="form-group half">
                    <label for="project_type">项目类型</label>
                    <select id="project_type" name="project_type" class="form-control"
                            onchange="updateFloorHeight()">
                        <option value="residential" {% if project.project_type == 'residential' %}selected{% endif %}>住宅/样板房（默认层高2.80m）</option>
                        <option value="commercial" {% if project.project_type == 'commercial' %}selected{% endif %}>商业/办公（默认层高3.00m）</option>
                        <option value="lobby" {% if project.project_type == 'lobby' %}selected{% endif %}>大堂/门厅（默认层高4.50m）</option>
                        <option value="showroom" {% if project.project_type == 'showroom' %}selected{% endif %}>售楼部/展厅（默认层高4.00m）</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label for="default_floor_height">层高 (m)</label>
                    <input type="number" id="default_floor_height" name="default_floor_height"
                           class="form-control" step="0.01" min="2.00" max="6.00"
                           value="{{ project.default_floor_height or 2.80 }}">
                    <p class="text-muted small">如图纸有标注则以图纸为准</p>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存配置</button>
                <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const floorHeights = { residential: 2.80, commercial: 3.00, lobby: 4.50, showroom: 4.00 };
function updateFloorHeight() {
    const type = document.getElementById('project_type').value;
    const fh = floorHeights[type] || 2.80;
    document.getElementById('default_floor_height').value = fh;
}
</script>
{% endblock %}
