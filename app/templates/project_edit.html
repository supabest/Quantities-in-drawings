{% extends "base.html" %}
{% block title %}编辑项目 - {{ project.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>编辑项目</h2>
    <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-outline btn-sm">返回</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="project-form">
            <div class="form-group">
                <label for="name">项目名称 <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="form-control"
                       value="{{ project.name }}" required>
            </div>
            <div class="form-group">
                <label for="description">项目描述</label>
                <textarea id="description" name="description" class="form-control"
                          rows="3">{{ project.description or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="address">项目地址</label>
                <input type="text" id="address" name="address" class="form-control"
                       value="{{ project.address or '' }}">
            </div>
            <div class="form-group">
                <label for="drawing_type">图纸类型</label>
                <select id="drawing_type" name="drawing_type" class="form-control">
                    <option value="floor_plan" {% if project.drawing_type == 'floor_plan' %}selected{% endif %}>平面图</option>
                    <option value="elevation" {% if project.drawing_type == 'elevation' %}selected{% endif %}>立面图</option>
                    <option value="section" {% if project.drawing_type == 'section' %}selected{% endif %}>剖面图</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
