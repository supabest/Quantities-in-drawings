{% extends "base.html" %}
{% block title %}用户注册{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2>申请账户</h2>
        <p class="auth-info">提交注册后需管理员审核通过方可使用系统。</p>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">用户名 <span class="required">*</span></label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="email">邮箱 <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
                <label for="password">密码 <span class="required">*</span></label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="至少6位密码" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">确认密码 <span class="required">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-control" placeholder="再次输入密码" required>
            </div>
            <div class="form-group">
                <label for="company">公司名称</label>
                <input type="text" id="company" name="company" class="form-control"
                       placeholder="可选">
            </div>
            <div class="form-group">
                <label for="phone">联系电话</label>
                <input type="tel" id="phone" name="phone" class="form-control"
                       placeholder="可选">
            </div>
            <button type="submit" class="btn btn-primary btn-block">提交注册申请</button>
        </form>
        <div class="auth-links">
            <p>已有账户？<a href="{{ url_for('auth.login') }}">立即登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
