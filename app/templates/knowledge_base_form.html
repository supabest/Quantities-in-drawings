{% extends "base.html" %}
{% block title %}添加知识库条目{% endblock %}

{% block content %}
<div class="page-header">
    <h2>添加知识库条目</h2>
    <a href="{{ url_for('main.knowledge_base') }}" class="btn btn-outline btn-sm">返回知识库</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="project-form">
            <div class="form-group">
                <label for="title">标题 <span class="required">*</span></label>
                <input type="text" id="title" name="title" class="form-control"
                       placeholder="如：厨柜计量单位不可按面积混淆" required>
            </div>
            <div class="form-group">
                <label for="category">类别</label>
                <select id="category" name="category" class="form-control">
                    <option value="rule">规则</option>
                    <option value="pitfall">踩坑/注意事项</option>
                    <option value="edge_case">边界情况</option>
                </select>
            </div>
            <div class="form-group">
                <label for="scenario">应用场景</label>
                <input type="text" id="scenario" name="scenario" class="form-control"
                       placeholder="如：商业项目-售楼部前台计量">
            </div>
            <div class="form-group">
                <label for="description">规则描述 <span class="required">*</span></label>
                <textarea id="description" name="description" class="form-control"
                          rows="5" placeholder="详细描述规则内容、计算方式、注意要点..." required></textarea>
            </div>
            <div class="form-group">
                <label for="source">来源</label>
                <input type="text" id="source" name="source" class="form-control"
                       placeholder="如：XX项目-图纸A-01 / 经验总结">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存条目</button>
                <a href="{{ url_for('main.knowledge_base') }}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
